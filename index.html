<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nour Abou Zour · Guides</title>
  <meta name="description" content="Free PDF guides from @nour_abou_zour's reels. Search the word you commented to find yours.">
  <meta name="theme-color" content="#f7f8fc">
  <meta property="og:title" content="Nour Abou Zour · Guides">
  <meta property="og:image" content="https://nourabouzour.github.io/tutorials/brand/instagram-profile-1080.png">
  <meta property="og:description" content="Free PDF guides from my reels. Search the word you commented to find yours.">
  <link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
  <link rel="apple-touch-icon" href="brand/instagram-profile-1080.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="grid-lines"></div>
  </div>

  <nav class="topbar">
    <a class="brand" id="brand" target="_blank" rel="noopener">
      <img class="brand-mark" src="brand/logo-icon.svg" alt="" width="34" height="34">
      <span class="brand-name" id="brand-name"></span>
    </a>
    <a class="follow" id="follow" target="_blank" rel="noopener">Follow</a>
  </nav>

  <main class="wrap">
    <header class="hero">
      <div class="avatar-ring"><div class="avatar" id="avatar" aria-hidden="true"></div></div>
      <span class="pill" id="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
        <span></span>
      </span>
      <h1 id="site-name"></h1>
      <p class="lead" id="site-intro" dir="auto"></p>
    </header>

    <div class="controls">
      <div class="search" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Type the word you commented…" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Search guides" dir="auto">
        <button id="clear" class="clear" type="button" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="filters">
        <div class="chips" role="group" aria-label="Filter by date posted" id="ranges">
          <button type="button" class="chip" data-range="all" aria-pressed="true">All time</button>
          <button type="button" class="chip" data-range="7" aria-pressed="false">Last 7 days</button>
          <button type="button" class="chip" data-range="30" aria-pressed="false">Last 30 days</button>
          <button type="button" class="chip" data-range="90" aria-pressed="false">Last 3 months</button>
          <button type="button" class="chip" data-range="year" aria-pressed="false">This year</button>
        </div>
        <button type="button" class="sort" id="sort" aria-label="Change sort order">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4"/><path d="M14 6h7M14 12h5M14 18h3"/></svg>
          <span id="sort-label">Newest first</span>
        </button>
      </div>
    </div>

    <p class="count" id="count" aria-live="polite"></p>

    <section class="list" id="list"></section>

    <div class="empty" id="empty" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
      <p class="empty-title" id="empty-title">No guide found</p>
      <p class="empty-text" id="empty-text">Check the spelling of the word from the reel, or <button type="button" class="link" id="show-all">see all guides</button>.</p>
      <p class="empty-text" id="empty-soon" hidden>The first guides are on their way. Follow along on Instagram so you don't miss them.</p>
    </div>

    <footer class="foot">
      <a id="foot-link" target="_blank" rel="noopener"></a>
      <p>© <span id="year"></span> <span id="foot-name"></span></p>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=2"></script>
</body>
</html>
